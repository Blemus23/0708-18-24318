name: Pruebas Cypress

on:
  push:            # cada push, en cualquier rama
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cypress:
    name: cypress
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar la pagina
        run: |
          npm start > servidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:3001 && echo "Servidor listo" && exit 0
            sleep 1
          done
          echo "El servidor no respondio"; cat servidor.log; exit 1

      - name: Correr las pruebas de Cypress
        run: npx cypress run --browser electron

      - name: Guardar evidencia (videos y capturas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencia
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore
          retention-days: 30
